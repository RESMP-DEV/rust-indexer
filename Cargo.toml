[package]
name = "rust-indexer"
version = "0.1.0"
edition = "2021"
description = "Fast local-first CLI for semantic + lexical code indexing and search"
license = "MIT"
repository = "https://github.com/RESMP-DEV/rust-indexer"
keywords = ["code-search", "semantic-indexing", "tree-sitter", "cli"]
categories = ["development-tools", "command-line-utilities", "text-processing"]

[lib]
name = "rust_indexer"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rayon = "1.10"
ignore = "0.4"
tree-sitter = "0.26"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-scala = "0.25"
tree-sitter-c-sharp = "0.23"
once_cell = "1.19"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
tantivy = "=0.26.1" # GHSA-rhfx-m35p-ff5j

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "rust-indexer"
path = "src/main.rs"

[profile.release]
lto = true
